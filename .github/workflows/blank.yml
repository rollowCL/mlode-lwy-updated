# This is a basic workflow to help you get started with Actions
name: Deploy test branch

on:
  push:
    branches: [test]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/karatecy_test/
          dangerous-clean-slate: false   # never delete files on the server that aren't in the repo (wp-config.php, uploads, wp core)
          log-level: verbose
          dry-run: true   # DIAGNOSTIC: no files are written to the server while this is true
